services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: edututor, POSTGRES_PASSWORD: edututor, POSTGRES_DB: edututor}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes:
      - qdrantdata:/qdrant/storage
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://edututor:edututor@postgres/edututor
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports: ["8000:8000"]
    depends_on: [postgres, qdrant]
    volumes:
      - ./uploads:/app/uploads
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  qdrantdata:

